name: Check installer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bash syntax
        run: bash -n install.sh tests/smoke.sh
      - name: ShellCheck
        run: shellcheck install.sh tests/smoke.sh
      - name: Smoke tests
        run: bash tests/smoke.sh
