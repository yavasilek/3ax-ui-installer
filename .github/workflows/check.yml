name: Check installer

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "*.md"
      - "docs/**/*.md"
      - ".github/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
      - ".work.bvc"
      - ".work.bvc/**"
      - ".workgraph/**"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  shellcheck:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bash syntax
        run: |
          for script in install.sh tests/*.sh; do
            bash -n "$script"
          done
      - name: ShellCheck
        run: shellcheck install.sh tests/*.sh
      - name: Smoke tests
        run: bash tests/smoke.sh
      - name: Ubuntu Snapshot headers smoke test
        run: bash tests/ubuntu-snapshot-smoke.sh
      - name: Debian Snapshot headers smoke test
        run: bash tests/debian-snapshot-smoke.sh
      - name: 3AX-UI stable release smoke test
        run: bash tests/upstream-release-smoke.sh
      - name: APT policy pipefail regression
        run: bash tests/apt-policy-pipefail-smoke.sh
      - name: Disabled AWG runtime regression
        run: bash tests/awg-disabled-runtime-smoke.sh
